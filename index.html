<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Model Explorer</title>
  <link rel="stylesheet" href="aa-plot.css">
</head>
<body>
  <!-- Chart (SVG is drawn here by aa-plot.js) -->
  <div id="plot"></div>

  <!-- Hover tooltip -->
  <div id="tip"></div>

  <!-- Vendor / model legend -->
  <div id="leg"></div>

  <!-- Data source note (filled by aa-plot.js from AA_DATA) -->
  <div id="src"></div>

  <!-- Toolbar -->
  <div id="bar">
    <span>
      X <select id="xsel" autocomplete="off"></select>
      <label><input type="checkbox" id="xlog" checked autocomplete="off"> log</label>
    </span>
    <span>
      Y <select id="ysel" autocomplete="off"></select>
      <label><input type="checkbox" id="ylog" autocomplete="off"> log</label>
    </span>
    <span>
      <button id="axswap" title="Swap X and Y (columns and log settings)">⇄ Swap axes</button>
      <button id="axreset" title="Reset X/Y to cost (log) vs intelligence">Reset axes</button>
    </span>
    <button id="legsw" title="Show or hide the vendor list">Vendors ▾</button>
    <span>
      <label><input type="checkbox" id="focussw" autocomplete="off"> Focus mode</label>
    </span>
    <span>
      <label title="Include models the leaderboard deprecated or no longer lists (shown hollow, with their last known values)"><input type="checkbox" id="oldsw" autocomplete="off"> Show retired/deprecated</label>
    </span>
    <a id="repo" href="https://github.com/xavierhd/AI-model-explorer" target="_blank" rel="noopener" title="Source code on GitHub" aria-label="Source code on GitHub">
      <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true">
        <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
    </a>
  </div>

  <script src="aa-data.js"></script>
  <script src="aa-plot.js"></script>
</body>
</html>
